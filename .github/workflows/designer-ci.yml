name: Designer CI

# No paths filter: "Designer Tests" is a required check, and a required check that never reports blocks the merge.
on:
  push:
    branches:
      - master
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Designer Tests
    runs-on: ubuntu-latest
    env:
      # secrets are absent on fork PRs; the coverage upload is skipped then instead of failing
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    defaults:
      run:
        working-directory: UIFrameworkDesigner
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: UIFrameworkDesigner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # also type-checks
      - name: Build
        run: npm run build

      - name: Upload coverage
        if: env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: UIFrameworkDesigner/coverage/lcov.info

name: Build

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'deployCheck/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Stardew Mods.sln
  # ModBuildConfig puts every mod's release zip here.
  ZIP_DIR: _releases
  # coverage upload is skipped when the secret is unavailable (e.g. fork PRs)
  CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # for attestation
      attestations: write # for attestation
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-tags: false

    # installs .NET 6 (the game's runtime) and the game + SMAPI reference assemblies from
    # StardewModders/mod-reference-assemblies, in a game folder ModBuildConfig finds automatically
    - name: Add build environment
      uses: Pathoschild/SMAPI-ModBuildWorkflow/add-build-environment@0a8b012b28a8449d6a5a3678f7a88f99492bb63e # v1

    # the mods target .NET 6, but are written against the SDK used locally (newer C# language features)
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Set release version
      id: release
      shell: pwsh
      env:
        BRANCH: ${{ github.ref_name }}
      run: ./build/Set-ReleaseVersion.ps1 -Branch $env:BRANCH

    # every other build gets preview versions like 2.0.1-alpha.202609222359
    - name: Set prerelease versions
      if: steps.release.outputs.is-release != 'true'
      uses: Pathoschild/SMAPI-ModBuildWorkflow/set-prerelease-versions@0a8b012b28a8449d6a5a3678f7a88f99492bb63e # v1

    - name: Build Mods
      run: dotnet build "$SOLUTION" --configuration Release -p:EnableModDeploy=false -p:ModZipPath="$GITHUB_WORKSPACE/$ZIP_DIR"

    - name: Test
      run: dotnet test "$SOLUTION" --configuration Release --no-build --results-directory TestResults --collect "XPlat Code Coverage"

    - name: Upload coverage
      if: env.CODACY_PROJECT_TOKEN != ''
      uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
      with:
        project-token: ${{ env.CODACY_PROJECT_TOKEN }}
        coverage-reports: TestResults/**/coverage.cobertura.xml

    # one artifact per mod, plus an attestation for release builds
    - name: Upload build
      id: upload
      uses: Pathoschild/SMAPI-ModBuildWorkflow/upload-release-artifacts@0a8b012b28a8449d6a5a3678f7a88f99492bb63e # v1
      with:
        path: ${{ env.ZIP_DIR }}
        create_attestations: ${{ steps.release.outputs.is-release == 'true' }}

    - name: Stage release
      if: steps.release.outputs.is-release == 'true'
      shell: pwsh
      env:
        RELEASE: ${{ steps.release.outputs.release }}
        ATTESTATION_URL: ${{ steps.upload.outputs.attestation-url }}
      run: |
        $release = $env:RELEASE | ConvertFrom-Json
        $out = New-Item -ItemType Directory -Force -Path _staged-release
        foreach ($mod in $release.mods) {
          $zip = Join-Path $env:ZIP_DIR $mod.zip
          if (-not (Test-Path -LiteralPath $zip)) { throw "Expected release package '$zip' wasn't built." }
          Copy-Item -LiteralPath $zip -Destination $out
        }
        $release | Add-Member attestation $env:ATTESTATION_URL
        $release | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $out 'release-info.json')

    - name: Upload release
      if: steps.release.outputs.is-release == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: Release
        path: _staged-release/
        if-no-files-found: error

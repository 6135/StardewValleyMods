name: Build

on:
  push:
    branches:
      - master
      - 'release/**'
      - 'deployCheck/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  # Disable the .NET logo in the console output.
  DOTNET_NOLOGO: true
  # Disable the .NET first time experience to skip caching NuGet packages and speed up the build.
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  # Disable sending .NET CLI telemetry to Microsoft.
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # ModBuildConfig reads the game folder from here (see <GamePath> in each .csproj).
  STARDEW_GAME_DIR: ${{ github.workspace }}/.game-refs
  SOLUTION: Stardew Mods.sln
  # ModBuildConfig puts every mod's release zip here.
  ZIP_DIR: _releases

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write     # for attestation
      attestations: write # for attestation
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-tags: false

    # Game + SMAPI reference assemblies (public API only, no code) so the mods compile without a game install.
    - name: Add reference assemblies
      uses: actions/checkout@v5
      with:
        repository: StardewModders/mod-reference-assemblies
        ref: main
        path: .game-refs
        fetch-tags: false
        persist-credentials: false

    # .NET 6 is the game's runtime; the newer SDK matches the one used locally (newer C# language features).
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          6.0.x
          10.0.x

    - name: Set release version
      id: release
      shell: pwsh
      env:
        BRANCH: ${{ github.ref_name }}
      run: ./build/Set-ReleaseVersion.ps1 -Branch $env:BRANCH

    # every other build gets preview versions like 2.0.1-alpha.202609222359
    - name: Set prerelease versions
      if: steps.release.outputs.is-release != 'true'
      shell: pwsh
      run: ./build/Set-PrereleaseVersions.ps1

    - name: Build Mods
      run: dotnet build "$SOLUTION" --configuration Release -p:EnableModDeploy=false -p:ModZipPath="$GITHUB_WORKSPACE/$ZIP_DIR"

    - name: Upload build
      uses: actions/upload-artifact@v5
      with:
        name: Build
        path: ${{ env.ZIP_DIR }}/*.zip
        if-no-files-found: error

    - name: Create attestation
      id: attest
      if: steps.release.outputs.is-release == 'true'
      uses: actions/attest-build-provenance@v2
      with:
        subject-path: ${{ env.ZIP_DIR }}/*.zip

    - name: Stage release
      if: steps.release.outputs.is-release == 'true'
      shell: pwsh
      env:
        MOD_NAME: ${{ steps.release.outputs.mod-name }}
        MOD_TAG: ${{ steps.release.outputs.mod-tag }}
        MOD_VERSION: ${{ steps.release.outputs.version }}
        ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
      run: |
        $zip = Join-Path $env:ZIP_DIR "$env:MOD_NAME $env:MOD_VERSION.zip"
        if (-not (Test-Path -LiteralPath $zip)) { throw "Expected release package '$zip' wasn't built." }
        $out = New-Item -ItemType Directory -Force -Path _staged-release
        Copy-Item -LiteralPath $zip -Destination $out
        @{
          name = $env:MOD_NAME
          tag = $env:MOD_TAG
          version = $env:MOD_VERSION
          zip = (Split-Path $zip -Leaf)
          attestation = $env:ATTESTATION_URL
        } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out 'release-info.json')

    - name: Upload release
      if: steps.release.outputs.is-release == 'true'
      uses: actions/upload-artifact@v5
      with:
        name: Release
        path: _staged-release/
        if-no-files-found: error

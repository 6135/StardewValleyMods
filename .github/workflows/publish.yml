name: Publish

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - 'release/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    # only publish successful builds of pushes to this repository (never pull requests, which could come from a fork
    # whose branch happens to be named release/...)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: Release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: List all files
        run: ls -R release

      # release-info.json: { tag, title, prerelease, attestation, mods: [ { name, version, zip } ] }
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          info=release/release-info.json
          cat "$info"
          tag=$(jq -r .tag "$info")
          title=$(jq -r .title "$info")
          attestation=$(jq -r '.attestation // ""' "$info")
          # gh expands asset paths as globs, so escape the glob characters in names like "[CP] Sweet Mines 1.0.0.zip"
          b='\'
          zips=()
          while IFS= read -r zip; do
            zip=${zip//"$b"/"$b$b"}; zip=${zip//"["/"$b["}; zip=${zip//"]"/"$b]"}; zip=${zip//"*"/"$b*"}; zip=${zip//"?"/"$b?"}
            zips+=("release/$zip")
          done < <(jq -r '.mods[].zip' "$info")

          prerelease=()
          if [[ "$(jq -r .prerelease "$info")" == "true" ]]; then prerelease=(--prerelease); fi
          notes=""
          if [[ -n "$attestation" ]]; then notes="See the [security attestation]($attestation) for how these zips were built."; fi

          gh release create "$tag" "${zips[@]}" \
            --target "$SHA" \
            --title "$title" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease[@]}"

name: Publish

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches:
      - 'release/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    # only publish successful builds of pushes to this repository (never pull requests, which could come from a fork
    # whose branch happens to be named release/...)
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: Release
          path: release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get release info
        id: get-version
        run: |
          info=release/release-info.json
          cat "$info"
          {
            echo "name=$(jq -r .name "$info")"
            echo "version=$(jq -r .version "$info")"
            echo "tag=$(jq -r '.tag + "/v" + .version' "$info")"
            echo "zip=release/$(jq -r .zip "$info")"
            echo "attestation=$(jq -r '.attestation // ""' "$info")"
          } >> "$GITHUB_OUTPUT"

      - name: List all files
        run: ls -R release

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.get-version.outputs.tag }}
          TITLE: ${{ steps.get-version.outputs.name }} ${{ steps.get-version.outputs.version }}
          ZIP: ${{ steps.get-version.outputs.zip }}
          VERSION: ${{ steps.get-version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          ATTESTATION: ${{ steps.get-version.outputs.attestation }}
        run: |
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          notes=""
          if [[ -n "$ATTESTATION" ]]; then notes="See the [security attestation]($ATTESTATION) for how this zip was built."; fi
          gh release create "$TAG" "$ZIP" \
            --target "$SHA" \
            --title "$TITLE" \
            --notes "$notes" \
            --generate-notes \
            "${prerelease[@]}"
